<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mis Tarjetas</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@300;400;600&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    background: linear-gradient(135deg, #1a0a2e 0%, #2d1b69 50%, #1a0a2e 100%);
    font-family: 'Montserrat', sans-serif;
    display: flex; align-items: center; justify-content: center;
    padding: 40px 20px;
  }
  .container { width: 100%; max-width: 500px; }
  .header {
    text-align: center; margin-bottom: 40px;
  }
  .header .icon { font-size: 50px; margin-bottom: 10px; animation: float 3s ease-in-out infinite; }
  @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
  .header h1 {
    font-family: 'Great Vibes', cursive; font-size: 42px;
    background: linear-gradient(135deg, #f9d423, #ff6f00, #f9d423);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text; margin-bottom: 5px;
  }
  .header p {
    font-weight: 300; font-size: 13px; color: rgba(255,255,255,0.5);
    letter-spacing: 4px; text-transform: uppercase;
  }
  .cards { display: flex; flex-direction: column; gap: 16px; }
  .card-link {
    display: flex; align-items: center; gap: 16px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 20px; padding: 20px 24px;
    text-decoration: none; color: #fff;
    transition: transform 0.3s, box-shadow 0.3s, background 0.3s;
    backdrop-filter: blur(10px);
  }
  .card-link:hover {
    transform: translateY(-3px);
    box-shadow: 0 12px 40px rgba(0,0,0,0.3);
    background: rgba(255,255,255,0.1);
  }
  .card-link:active { transform: scale(0.98); }
  .card-emoji { font-size: 36px; flex-shrink: 0; }
  .card-info { flex: 1; }
  .card-info .name {
    font-family: 'Great Vibes', cursive; font-size: 26px; margin-bottom: 2px;
  }
  .card-info .type {
    font-weight: 300; font-size: 12px; color: rgba(255,255,255,0.5);
    letter-spacing: 2px; text-transform: uppercase;
  }
  .card-arrow { font-size: 18px; color: rgba(255,255,255,0.3); }
  .card-link[data-color="pink"] .name { background: linear-gradient(135deg, #f9d423, #ff6f00); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  .card-link[data-color="orange"] .name { background: linear-gradient(135deg, #ffab91, #d84315); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  .card-link[data-color="blue"] .name { background: linear-gradient(135deg, #90caf9, #1565c0); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  .card-link[data-color="purple"] .name { background: linear-gradient(135deg, #ce93d8, #7b1fa2); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  .card-link[data-color="green"] .name { background: linear-gradient(135deg, #d4af37, #2e7d52); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  .card-link[data-color="teal"] .name { background: linear-gradient(135deg, #80deea, #00838f); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  .card-link[data-color="violet"] .name { background: linear-gradient(135deg, #f9d423, #ff4e50); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  .stars { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
  .star { position: absolute; width: 2px; height: 2px; background: #fff; border-radius: 50%; animation: twinkle 3s ease-in-out infinite; }
  @keyframes twinkle { 0%,100%{opacity:0.2} 50%{opacity:1} }
</style>
</head>
<body>
<div class="stars" id="stars"></div>
<div class="container">
  <div class="header">
    <div class="icon">💌</div>
    <h1>Mis Tarjetas</h1>
    <p>Elige una para abrir</p>
  </div>
  <div class="cards">
    <a class="card-link" data-color="pink" href="mama-eduvina.html">
      <span class="card-emoji">👩‍👧</span>
      <div class="card-info">
        <div class="name">Eduvina</div>
        <div class="type">Feliz Día Mamá</div>
      </div>
      <span class="card-arrow">›</span>
    </a>
    <a class="card-link" data-color="orange" href="mama-mariel.html">
      <span class="card-emoji">🔥</span>
      <div class="card-info">
        <div class="name">Mariel</div>
        <div class="type">Feliz Día Mamá</div>
      </div>
      <span class="card-arrow">›</span>
    </a>
    <a class="card-link" data-color="blue" href="mama-karla.html">
      <span class="card-emoji">🦋</span>
      <div class="card-info">
        <div class="name">Karla</div>
        <div class="type">Feliz Día Mamá</div>
      </div>
      <span class="card-arrow">›</span>
    </a>
    <a class="card-link" data-color="purple" href="mama-paola.html">
      <span class="card-emoji">👑</span>
      <div class="card-info">
        <div class="name">Paola</div>
        <div class="type">Feliz Día Mamá</div>
      </div>
      <span class="card-arrow">›</span>
    </a>
    <a class="card-link" data-color="green" href="mama-maribel.html">
      <span class="card-emoji">🌿</span>
      <div class="card-info">
        <div class="name">Maribel</div>
        <div class="type">Feliz Día Mamá</div>
      </div>
      <span class="card-arrow">›</span>
    </a>
    <a class="card-link" data-color="teal" href="mama-ericka.html">
      <span class="card-emoji">🌊</span>
      <div class="card-info">
        <div class="name">Ericka</div>
        <div class="type">Feliz Día Mamá</div>
      </div>
      <span class="card-arrow">›</span>
    </a>
    <a class="card-link" data-color="violet" href="cumple.html">
      <span class="card-emoji">🎂</span>
      <div class="card-info">
        <div class="name">Arisdelsie</div>
        <div class="type">Feliz Cumpleaños</div>
      </div>
      <span class="card-arrow">›</span>
    </a>
  </div>
</div>
<script>
const starsEl=document.getElementById('stars');
for(let i=0;i<50;i++){const s=document.createElement('div');s.className='star';s.style.left=Math.random()*100+'%';s.style.top=Math.random()*100+'%';s.style.animationDelay=Math.random()*3+'s';s.style.animationDuration=(2+Math.random()*3)+'s';starsEl.appendChild(s);}
</script>
</body>
</html>
